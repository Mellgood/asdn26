# Lab 16 — Single SDN Switch in Kathará
#
# Topology (data plane):
#   pc1 ──[A]── s1 ──[B]── pc2
#
# Management plane (out-of-band):
#   controller ──[MGMT]── s1

# --- Ryu Controller ---
# Uses the custom asdn/sdn image (has Ryu installed).
# Build it once with: docker build -t asdn/sdn -f ../docker/Dockerfile.sdn ../docker/
controller[image]="asdn/sdn"
controller[0]="MGMT"

# Example provided indicating how to inject the dedicated SDN image for a specific Kathará node
s1[image]="kathara/sdn"
s1[0]="A"
s1[1]="B"
s1[2]="MGMT"

