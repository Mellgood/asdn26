# Lab 18: Enterprise SDN Network — Exam Playground
#
# Topology (data plane):
#   ext1 ──[F]── r1 ──[A]── s1 ──[B]── h1
#                            │
#                           [C]
#                            │
#                            s2 ──[D]── h2
#                            │
#                           [E]
#                            │
#                            h3
#
# Management plane (out-of-band):
#   controller ──[MGMT]── s1, s2

# --- Ryu Controller ---
# Uses the custom asdn/sdn image (has Ryu installed).
# Build it once with: docker build -t asdn/sdn -f ../docker/Dockerfile.sdn ../docker/
controller[image]="asdn/sdn"
controller[0]="MGMT"

# --- Gateway Router ---
r1[0]="F"
r1[1]="A"

# --- Core SDN Switch ---
s1[image]="kathara/sdn"
s1[0]="A"
s1[1]="B"
s1[2]="C"
s1[3]="MGMT"

# --- Access SDN Switch ---
s2[image]="kathara/sdn"
s2[0]="C"
s2[1]="D"
s2[2]="E"
s2[3]="MGMT"

# --- Internal Hosts ---
h1[0]="B"
h2[0]="D"
h3[0]="E"

# --- External Client ---
ext1[0]="F"
