# Kathará Lab 17 Solution — lab.conf
# The controller and MGMT domain are pre-configured.
# Students need to add s2, s3 (with MGMT), h1, and h2.

controller[image]="asdn/sdn"
controller[0]="MGMT"

# --- Switches ---
s1[image]="kathara/sdn"
s1[0]="A"
s1[1]="B"
s1[2]="MGMT"

s2[image]="kathara/sdn"
s2[0]="B"
s2[1]="C"
s2[2]="MGMT"

s3[image]="kathara/sdn"
s3[0]="C"
s3[1]="D"
s3[2]="MGMT"

# --- Hosts ---
h1[0]="A"
h2[0]="D"
