# Kathará Lab 17 - Multi-Switch SDN Fabric
# 3 OVS switches in a linear chain, all controlled by a single Ryu instance.
#
# Topology (data plane):
#   h1 ──[A]── s1 ──[B]── s2 ──[C]── s3 ──[D]── h2
#
# Management plane (out-of-band):
#   controller ──[MGMT]── s1, s2, s3

# --- Ryu Controller ---
# Uses the custom asdn/sdn image (has Ryu installed).
# Build it once with: docker build -t asdn/sdn -f ../docker/Dockerfile.sdn ../docker/
controller[image]="asdn/sdn"
controller[0]="MGMT"

# --- Switch s1 (fully configured as example) ---
s1[image]="kathara/sdn"
s1[0]="A"
s1[1]="B"
s1[2]="MGMT"

